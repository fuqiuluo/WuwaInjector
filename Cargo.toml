[package]
name = "injector"
version = "0.1.0"
edition = "2024"
authors = ["fuqiuluo"]

[workspace]
members = [
    "xdl-rs",
    "android-properties",
]

[dependencies]
xdl-rs = { path = "xdl-rs" }
android-properties = { path = "android-properties" }
anyhow = "1.0.101"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
proc-maps = "0.4"
libc = "1.0.0-alpha.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dependencies.nix]
version = "0.31.1"
features = ["signal", "pthread", "ptrace", "inotify", "poll", "uio", "process", "mman", "socket"]